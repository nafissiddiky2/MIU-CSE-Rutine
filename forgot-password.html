<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MIU Routine</title>
    <link rel="icon" type="image/png" href="images/manarat.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="logo">
                <h1>🔑 Forgot Password</h1>
                <p>Enter your Student ID to receive OTP</p>
            </div>
            <form id="forgotForm">
                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" placeholder="e.g., 0000CSE00000" required>
                </div>
                <button type="submit" class="btn btn-primary">Send OTP</button>
            </form>
            <div class="auth-footer">
                <p><a href="login.html">← Back to Login</a></p>
            </div>
            <div id="messageBox" class="error-message"></div>
        </div>
    </div>
    <footer class="footer">
        <p>&copy; 2026 MIU CSE Department. Developed By <a href="https://nafissiddiky2.github.io/Portfolio/">S.A.Nafis</a></p>
    </footer>

    <script>
        const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxOXxupqYJkH_K4QCwkxT7SdE07-CEAWmOQArnbBcraYrOn9tPHNivffod7Suwpdu_r9Q/exec';
        
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const studentId = document.getElementById('studentId').value.trim();
            const msgBox = document.getElementById('messageBox');
            const btn = e.target.querySelector('button');
            
            if (!studentId) {
                msgBox.textContent = 'Please enter your Student ID';
                msgBox.classList.add('show');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Sending...';
            
            try {
                const res = await fetch(SHEET_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'forgot_password', student_id: studentId })
                });
                const data = await res.json();
                
                if (data.success) {
                    msgBox.style.background = '#d4edda';
                    msgBox.style.color = '#155724';
                    msgBox.textContent = 'OTP sent to ' + data.email;
                    msgBox.classList.add('show');
                    
                    // Redirect to OTP verification
                    setTimeout(() => {
                        window.location.href = 'verify-otp.html?id=' + studentId;
                    }, 1500);
                } else {
                    msgBox.style.background = '#f8d7da';
                    msgBox.style.color = '#721c24';
                    msgBox.textContent = data.error;
                    msgBox.classList.add('show');
                    btn.disabled = false;
                    btn.textContent = 'Send OTP';
                }
            } catch (err) {
                msgBox.textContent = 'Connection error. Please try again.';
                msgBox.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Send OTP';
            }
        });
    </script>
</body>
</html>
