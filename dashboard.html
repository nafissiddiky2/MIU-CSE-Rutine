<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MIU Routine System</title>
    <link rel="icon" type="image/png" href="images/manarat.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand"><img src="images/manarat.png" alt="Manarat" class="section-icon-sm"> MIU CSE Routine System</div>
            <div class="nav-user"><span id="userInfo">Loading...</span><button onclick="logout()" class="btn btn-outline">Sign Out</button></div>
        </div>
    </nav>
    <div class="dashboard-container">
        <div class="search-section">
            <div class="date-navigator">
                <button onclick="changeDay(-1)" class="btn btn-outline">◀ Yesterday</button>
                <h2 id="currentDay">Today</h2>
                <button onclick="changeDay(1)" class="btn btn-outline">Tomorrow ▶</button>
            </div>
            <div class="filter-section">
                <h3 style="margin-bottom:15px;color:#2d6a4f;">🔍 Filter Class Schedule</h3>
                <div class="search-boxes">
                    <div class="search-box"><label>Select Batch</label><select id="searchBatch" onchange="onFilterChange()"><option value="">My Batch</option></select></div>
                    <div class="search-box"><label>Select Room</label><select id="searchRoom" onchange="onFilterChange()"><option value="">All Rooms</option></select></div>
                    <div class="search-box"><label>Select Teacher</label><select id="searchTeacher" onchange="onFilterChange()"><option value="">All Teachers</option></select></div>
                    <button onclick="resetFilter()" class="btn btn-outline">↺ Reset Filters</button>
                </div>
            </div>
        </div>
        <div class="routine-display">
            <div class="routine-header"><h3>📚 Class Schedule - <span id="displayDay"></span></h3><span id="batchInfo">Your Batch</span></div>
            <div id="routineTable" class="routine-table"><div class="loading"><div class="spinner"></div><p>Loading routine data...</p></div></div>
        </div>
    </div>
    <footer class="footer"><p>&copy; 2026 MIU CSE Department. All rights reserved. Developed By <a href="https://nafissiddiky2.github.io/Portfolio/">S.A.Nafis</a></p></footer>

    <script>
        const SHEET_CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vQovxGy5N4TVqkJESrtQaaW20hhzqyppbgDKsiZs11fJp7pQoDfnaYjjhG5xcL6wXkijYF4Hi8FO36g/pub?output=csv&gid=350123385';
        const teacherNames={'DMR':'Prof. Dr. Mizanur Rahman','DRA':'Prof. Dr. Ramit Azad','MRI':'Mohammad Rafiqul Islam','TA':'Tanvir Ahmed','ZH':'Zahurul Haque','SSM':'Shreshtha Sayantika Maitra','JF':'Jannatul Ferdaous','NET':'Noor Easrib Tiba','SA':'Soaib Abdullah','HR':'Hasibul Rupok','MH':'Maoyejatun Hasana','MMU':'Mohammad Monzu Uddin','DAKA':'Dr. Mohammad Abul Kalam Azad','DSS':'Dr. Sabiha Sultana','MT':'Md. Toha','AAA':'Ahmad Abdullah Arman','BT':'Bushra Tasnim','DMMS':'Dr. Mohammad Mohiuddin Sarker','SH':'Md Shakil Hossain','ZI':'Md. Zahidul Islam','MMM':'Mohammed Mohaimen','JH':'Jayed Hasan Rakib','MAS':'MD. Adam Shafiullah','TK':'Tahsin Kabir','DHR':'Dr. Hafizur Rahman','MAI':'Muhammad Asadul Islam','LJ':'Ms. Liza Jourder'};
        let currentDate=new Date(),currentBatch='',currentBatchDisplay='',allRoutines=[];
        const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

        // Convert 24h time to 12h display: "14:00" → "2:00 PM"
        function to12Hour(t){
            const parts=t.trim().split(':');
            let h=parseInt(parts[0]);
            const m=parts[1];
            const ampm=h>=12?'PM':'AM';
            if(h>12)h-=12;
            if(h===0)h=12;
            return h+':'+m+' '+ampm;
        }

        function formatTime(t){
            if(!t)return'';
            const parts=t.split('-');
            const start=parts[0].trim();
            const end=parts[1]?parts[1].trim():start;
            return to12Hour(start)+' - '+to12Hour(end);
        }

        // Get start minutes for sorting (handles 24h format)
        function timeToMinutes(t){
            const start=t.split('-')[0].trim().split(':');
            return parseInt(start[0])*60+parseInt(start[1]);
        }

        function parseCSV(csv){
            const lines=csv.split('\n'),routines=[],dayMap={sat:'Saturday',sun:'Sunday',mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday'},timeSlots=[];
            let currentDay='';
            for(let i=0;i<lines.length;i++){
                const line=lines[i].trim();if(!line)continue;
                const cells=[];let c='',q=false;
                for(let j=0;j<line.length;j++){if(line[j]==='"')q=!q;else if(line[j]===','&&!q){cells.push(c.trim());c='';}else c+=line[j];}
                cells.push(c.trim());
                const first=cells[0].toLowerCase().trim();
                if(first==='abbreviation')break;
                if(first.startsWith('..........')||first.includes('jannatul'))break;
                if(cells[0]==='Day'&&cells[1]==='Room'){for(let k=2;k<cells.length;k++){if(cells[k]&&cells[k].includes(':'))timeSlots.push(cells[k]);}continue;}
                if(first.includes('manarat')||first.includes('class routine')||first.includes('updated on'))continue;
                if(dayMap[first]){currentDay=dayMap[first];continue;}
                if(currentDay&&cells.length>=3&&cells[1]&&timeSlots.length>0){
                    const room=cells[1];
                    for(let j=2;j<cells.length&&j-2<timeSlots.length;j++){
                        const data=cells[j]?.trim();if(!data)continue;
                        let clean=data.replace(/^\(/,'').replace(/\)$/,'').replace(/\)\s+([A-Z])/g,')/$1');
                        const parts=clean.split('/');if(parts.length<2)continue;
                        let batchPart=parts[0].trim(),course='',teacher='';
                        if(parts.length===2){course=parts[1].trim();}
                        else if(parts.length===3){course=parts[1].trim();teacher=parts[2].trim();}
                        else if(parts.length===4){course=parts[1]+'/'+parts[2];teacher=parts[3].trim();}
                        if(!course)continue;
                        const tokens=batchPart.split('+').map(t=>t.trim()).filter(Boolean);
                        for(const token of tokens){
                            const match=token.match(/^(\d+)(\([FM]\))?/);
                            if(match)routines.push({day:currentDay,time:timeSlots[j-2],startMin:timeToMinutes(timeSlots[j-2]),batch:match[1],batchDisplay:match[1]+(match[2]||''),course,room,teacher});
                        }
                    }
                }
            }
            return routines;
        }

        function mergeConsecutive(routines){
            if(!routines.length)return[];
            routines.sort((a,b)=>a.startMin-b.startMin);
            const merged=[];let prev=null;
            for(const r of routines){
                if(prev&&prev.course===r.course&&prev.batch===r.batch&&prev.room===r.room&&prev.teacher===r.teacher&&r.startMin===prev.startMin+60){
                    const pParts=prev.time.split('-'),rParts=r.time.split('-');
                    prev.time=pParts[0].trim()+' - '+rParts[1].trim();
                }else{if(prev)merged.push(prev);prev={...r};}
            }
            if(prev)merged.push(prev);
            return merged;
        }

        async function fetchRoutineData(){try{const r=await fetch(SHEET_CSV_URL),csv=await r.text();allRoutines=parseCSV(csv);console.log('Loaded',allRoutines.length,'routines');populateDropdowns();loadRoutine();}catch(e){console.error(e);}}

        function populateDropdowns(){
            const allBatches=[...new Set(allRoutines.map(r=>r.batchDisplay))].sort();
            const rooms=[...new Set(allRoutines.map(r=>r.room))].filter(Boolean).sort();
            const teachers=[...new Set(allRoutines.map(r=>r.teacher))].filter(Boolean).sort();
            const bs=document.getElementById('searchBatch');bs.innerHTML='<option value="">My Batch</option>';
            allBatches.forEach(b=>bs.innerHTML+=`<option value="${b}"> Batch ${b}</option>`);
            const rs=document.getElementById('searchRoom');rs.innerHTML='<option value="">All Rooms</option>';
            rooms.forEach(r=>rs.innerHTML+=`<option value="${r}"> ${r}</option>`);
            const ts=document.getElementById('searchTeacher');ts.innerHTML='<option value="">All Teachers</option>';
            teachers.forEach(t=>ts.innerHTML+=`<option value="${t}"> ${t} - ${teacherNames[t]||t}</option>`);
        }

        function onFilterChange(){const b=document.getElementById('searchBatch').value,r=document.getElementById('searchRoom').value,t=document.getElementById('searchTeacher').value;if(b){document.getElementById('searchRoom').value='';document.getElementById('searchTeacher').value='';}if(r){document.getElementById('searchBatch').value='';document.getElementById('searchTeacher').value='';}if(t){document.getElementById('searchBatch').value='';document.getElementById('searchRoom').value='';}loadRoutine();}

        function loadRoutine(){
            const day=days[currentDate.getDay()],sb=document.getElementById('searchBatch').value,sr=document.getElementById('searchRoom').value,st=document.getElementById('searchTeacher').value;
            const bi=document.getElementById('batchInfo');if(st)bi.textContent='👨‍🏫 Teacher: '+st;else if(sr)bi.textContent='🏫 Room: '+sr;else if(sb)bi.textContent='📚 Batch: '+sb;else bi.textContent='📚 Your Batch: '+currentBatchDisplay;
            let data=allRoutines.filter(r=>r.day===day);
            if(sb)data=data.filter(r=>r.batchDisplay===sb);else if(sr)data=data.filter(r=>r.room===sr);else if(st)data=data.filter(r=>r.teacher===st);else data=data.filter(r=>r.batchDisplay===currentBatchDisplay||r.batch===currentBatch);
            data=mergeConsecutive(data);
            data.sort((a,b)=>a.startMin-b.startMin);
            displayRoutine(data,day);
        }

        function displayRoutine(routines,day){
            const table=document.getElementById('routineTable');
            if(!routines.length){table.innerHTML=`<div class="no-data"><p style="font-size:3em;">📚</p><p><strong>No classes for ${day}</strong></p></div>`;return;}
            let html='<table><thead><tr><th>⏰ Time</th><th>📖 Course</th><th>👥 Batch</th><th>🏫 Room</th><th>👨‍🏫 Teacher</th></tr></thead><tbody>';
            routines.forEach(r=>{html+=`<tr><td class="time-cell">${formatTime(r.time)}</td><td><strong>${r.course}</strong></td><td><span class="batch-badge">Batch ${r.batchDisplay}</span></td><td>${r.room?`<span class="room-badge">${r.room}</span>`:'TBA'}</td><td>${r.teacher?`<span class="teacher-badge">${r.teacher}</span>`:'TBA'}</td></tr>`;});
            html+='</tbody></table>';table.innerHTML=html;
        }

        function changeDay(o){currentDate.setDate(currentDate.getDate()+o);updateDateDisplay();loadRoutine();}
        function resetFilter(){document.getElementById('searchBatch').value='';document.getElementById('searchRoom').value='';document.getElementById('searchTeacher').value='';currentDate=new Date();updateDateDisplay();loadRoutine();}
        function updateDateDisplay(){document.getElementById('currentDay').textContent=currentDate.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});document.getElementById('displayDay').textContent=days[currentDate.getDay()];}
        function logout(){localStorage.removeItem('miu_user');window.location.href='login.html';}

        const ud=localStorage.getItem('miu_user');
        if(ud){const u=JSON.parse(ud);currentBatch=u.batch?String(u.batch).replace(/\([FM]\)/,''):'00';currentBatchDisplay=u.batch||currentBatch;document.getElementById('userInfo').textContent='🎓 Batch: '+currentBatchDisplay+' | ID: '+u.student_id;document.getElementById('batchInfo').textContent='📚 Your Batch: '+currentBatchDisplay;updateDateDisplay();fetchRoutineData();}
        else window.location.href='login.html';
    </script>
</body>
</html>
