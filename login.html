<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔑 Login - MIU Routine System</title>
    <link rel="icon" type="image/png" href="images/manarat.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="logo">
                <div class="auth-logo">
                    <img src="images/manarat.png" alt="Manarat">
                    <h1>MIU Routine System</h1>
                </div>
                <p>Department of Computer Science & Engineering</p>
                <p style="font-size: 0.85em; color: #888;">Manarat International University</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" placeholder="e.g., 2465cse01176" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Keep me logged in for 15 days</span>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </div>
            <div id="errorMessage" class="error-message"></div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 MIU CSE Department. All rights reserved. Developed By <a href="https://nafissiddiky2.github.io/Portfolio/">S.A.Nafis</a></p>
    </footer>

    <script src="js/auth.js"></script>
</body>
</html>
