<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MIU Routine System</title>
    <link rel="icon" type="image/png" href="images/manarat.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="logo">
                <div class="auth-logo">
                    <img src="images/manarat.png" alt="Manarat">
                    <h1>MIU Routine System</h1>
                </div>
                <p>Department of Computer Science & Engineering</p>
                <p style="font-size: 0.85em; color: #888;">Manarat International University</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" placeholder="e.g., 2465cse01176" required>
                    <small style="color: #888; font-size: 0.8em;">⚠️NOTE: Skip leading zero (0) if your ID starts with one</small>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <div style="text-align: right; margin-top: -10px; margin-bottom: 15px;">
                    <a href="forgot-password.html" style="color: #2d6a4f; font-size: 0.9em; text-decoration: none;">Forgot Password?</a>
                </div>
                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Keep me logged in for 15 days</span>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </div>
            <div id="errorMessage" class="error-message"></div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 MIU CSE Department. All rights reserved. Developed By <a href="https://nafissiddiky2.github.io/Portfolio/">S.A.Nafis</a></p>
    </footer>

    <script>
        const STUDENT_SHEET_URL = 'https://script.google.com/macros/s/AKfycbyNUpRuevlE7dxTgSTykCfYT_cQDsLIKWDKvlJKpAPnEDKUswySTTN-d6sjik9InKGfxg/exec';

        function getBatchFromId(studentId) {
            const id = String(studentId).trim();
            const match1 = id.match(/^\d{2}(\d{2})[a-zA-Z]/i);
            if (match1) return match1[1];
            const match2 = id.match(/^(\d{3})/);
            if (match2) {
                const prefix = match2[1];
                const batchMap = {'015': '61', '016': '62', '017': '63'};
                return batchMap[prefix] || prefix;
            }
            return '00';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            let studentId = document.getElementById('studentId').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe')?.checked || false;
            
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            if (!studentId || !password) {
                errorDiv.textContent = 'Please fill all fields';
                errorDiv.classList.add('show');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';
            
            const extractedBatch = getBatchFromId(studentId);
            
            const userData = {
                student_id: studentId,
                batch: extractedBatch,
                loggedIn: true,
                loginTime: new Date().getTime()
            };
            
            localStorage.setItem('miu_user', JSON.stringify(userData));
            if (rememberMe) localStorage.setItem('miu_remember', 'true');
            
            try {
                const response = await fetch(STUDENT_SHEET_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'login', student_id: studentId, password: password })
                });
                const data = await response.json();
                if (data.success) {
                    userData.batch = data.batch || extractedBatch;
                    localStorage.setItem('miu_user', JSON.stringify(userData));
                }
            } catch (err) {}
            
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
