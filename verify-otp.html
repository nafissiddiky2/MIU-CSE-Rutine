<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - MIU Routine</title>
    <link rel="icon" type="image/png" href="images/manarat.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="logo">
                <h1>📧 Verify OTP</h1>
                <p>Enter the 6-digit code sent to your email</p>
            </div>
            <form id="otpForm">
                <div class="form-group">
                    <label for="otp">OTP Code</label>
                    <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary">Verify OTP</button>
            </form>
            <div class="auth-footer">
                <p><a href="forgot-password.html">← Resend OTP</a></p>
            </div>
            <div id="messageBox" class="error-message"></div>
        </div>
    </div>
    <footer class="footer">
        <p>&copy; 2026 MIU CSE Department. Developed By <a href="https://nafissiddiky2.github.io/Portfolio/">S.A.Nafis</a></p>
    </footer>

    <script>
        const SHEET_URL = 'https://script.google.com/macros/s/AKfycbyHSMI-w9mhIHVA6Z3NWFJbc0o9xr46l6jOSkK0q1fjyaoBuJhnyjr_6s95CHdXLYmstQ/exec';
        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('id');
        
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = document.getElementById('otp').value.trim();
            const msgBox = document.getElementById('messageBox');
            const btn = e.target.querySelector('button');
            
            if (!otp || otp.length !== 6) {
                msgBox.textContent = 'Please enter a valid 6-digit OTP';
                msgBox.classList.add('show');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Verifying...';
            
            try {
                const res = await fetch(SHEET_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'verify_otp', student_id: studentId, otp: otp })
                });
                const data = await res.json();
                
                if (data.success) {
                    window.location.href = 'reset-password.html?id=' + studentId;
                } else {
                    msgBox.textContent = data.error;
                    msgBox.classList.add('show');
                    btn.disabled = false;
                    btn.textContent = 'Verify OTP';
                }
            } catch (err) {
                msgBox.textContent = 'Connection error';
                msgBox.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Verify OTP';
            }
        });
    </script>
</body>
</html>
