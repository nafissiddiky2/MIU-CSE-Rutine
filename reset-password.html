<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MIU Routine</title>
    <link rel="icon" type="image/png" href="images/manarat.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="logo">
                <h1>🔒 Reset Password</h1>
                <p>Enter your new password</p>
            </div>
            <form id="resetForm">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" placeholder="Enter new password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary">Reset Password</button>
            </form>
            <div class="auth-footer">
                <p><a href="login.html">← Back to Login</a></p>
            </div>
            <div id="messageBox" class="error-message"></div>
        </div>
    </div>
    <footer class="footer">
        <p>&copy; 2026 MIU CSE Department. Developed By <a href="https://nafissiddiky2.github.io/Portfolio/">S.A.Nafis</a></p>
    </footer>

    <script>
        const SHEET_URL = 'https://script.google.com/macros/s/AKfycbyCnLN2Xv1AXxBVeZQnEWmJjhtLWUZxz31FLCCrz7zKoAtYwm0o185mKD6brXBEWzth1g/exec';
        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('id');
        
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const msgBox = document.getElementById('messageBox');
            const btn = e.target.querySelector('button');
            
            if (password !== confirmPassword) {
                msgBox.textContent = 'Passwords do not match!';
                msgBox.classList.add('show');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Resetting...';
            
            try {
                const res = await fetch(SHEET_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'reset_password', student_id: studentId, new_password: password })
                });
                const data = await res.json();
                
                if (data.success) {
                    msgBox.style.background = '#d4edda';
                    msgBox.style.color = '#155724';
                    msgBox.textContent = 'Password reset successful! Redirecting to login...';
                    msgBox.classList.add('show');
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    msgBox.textContent = data.error;
                    msgBox.classList.add('show');
                    btn.disabled = false;
                    btn.textContent = 'Reset Password';
                }
            } catch (err) {
                msgBox.textContent = 'Connection error';
                msgBox.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
